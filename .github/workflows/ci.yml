name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Build
        run: make build

      - name: Test
        run: make test

      - name: Format check
        run: make fmt

      # Pinned: needs a golangci-lint built with Go >= the go.mod directive.
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  # Surfaces deprecated config and packaging breakage here rather than at tag
  # time, when the only signal is a failed release.
  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Validate config
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: check

      - name: Build all artifacts
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=publish
