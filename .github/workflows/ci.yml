name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Build
        run: make build

      - name: Test
        run: make test

      - name: Vet
        run: make vet

      - name: Format check
        run: make fmt

      # Pinned: needs a golangci-lint built with Go >= the go.mod directive.
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
