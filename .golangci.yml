version: "2"

linters:
  settings:
    errcheck:
      exclude-functions:
        # Deferred after Commit, where a failed rollback is the expected no-op.
        - (*database/sql.Tx).Rollback
  exclusions:
    presets:
      # Unchecked Close/Flush/Setenv, which are noise on cleanup paths.
      - std-error-handling
