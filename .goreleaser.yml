version: 2

builds:
  - binary: cc360
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

nfpms:
  - id: cc360
    package_name: cc360
    vendor: Achton Smidt Winther
    homepage: "https://github.com/achton/cc360"
    maintainer: "Achton Smidt Winther <achton@reload.dk>"
    description: "Terminal UI for browsing and resuming Claude Code sessions"
    license: MIT
    formats:
      - deb
      - rpm
      - apk
    bindir: /usr/bin

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  format: "{{ .Message }}"
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))?!?:.+$'
      order: 0
    - title: Bug Fixes
      regexp: '^.*?fix(\(.+\))?!?:.+$'
      order: 1
    - title: Performance
      regexp: '^.*?perf(\(.+\))?!?:.+$'
      order: 2
    - title: Other
      order: 999
  filters:
    exclude:
      # Scoped types too (chore(deps):). Breaking changes (chore!:) stay in.
      - '^(docs|test|ci|chore|style)(\(.+\))?:'
      - "^Merge "

homebrew_casks:
  - repository:
      owner: achton
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://github.com/achton/cc360"
    description: "Terminal UI for browsing and resuming Claude Code sessions"
    license: "MIT"
    hooks:
      post:
        # Binaries are unsigned, so Gatekeeper blocks them without this.
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/cc360"]
          end
